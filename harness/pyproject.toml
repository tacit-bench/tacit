[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacit-bench"
version = "0.2.0"
description = "Harness of Tacit, an independent EU benchmark for System 1 decision models"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Greg Brzezinka"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tacit = "tacit.cli:main"

[tool.setuptools]
packages = ["tacit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
